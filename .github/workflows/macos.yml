name: macOS Intel and Apple Silicon builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: intel
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: brew install nasm sdl2
      - run: python3 -m pip install Pillow
      - run: python3 macos/build.py
      - name: Verify packaged architecture, rendering and signature
        run: python3 macos/test.py
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/jesussaves-macos-${{ matrix.arch }}.zip
