name: macOS Intel and Apple Silicon builds
on:
  push:
    branches: [main]
    tags: ['macos-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: intel
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: brew install nasm sdl2
      - run: python3 -m pip install Pillow
      - run: python3 macos/build.py
      - name: Verify packaged architecture, rendering and signature
        run: python3 macos/test.py
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/jesussaves-macos-${{ matrix.arch }}.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/macos-v')
    needs: [build, rosetta]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          merge-multiple: true
          path: dist
      - name: Publish Mac preview downloads and matching source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=tar.gz --prefix=jesussaves-macos/ HEAD > dist/jesussaves-macos-source.tar.gz
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./*.zip ./*.tar.gz SHA256SUMS --verify-tag --prerelease --title "Jesus Saves for Mac — Intel and Apple Silicon preview" --notes-file ../macos/RELEASE.md

  rosetta:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-intel
          path: dist
      - name: Install Apple Rosetta and test Intel compatibility on ARM
        run: |
          sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          ditto -x -k dist/jesussaves-macos-intel.zip preview
          arch -x86_64 'preview/Jesus Saves.app/Contents/MacOS/jesussaves' --cpu --snapshot
          test "$(head -n 2 flame.ppm | tail -n 1)" = '3840 2160'
